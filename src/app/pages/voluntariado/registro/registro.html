<section class="page-header">

  <div>
    <p>VOLUNTARIADO UBUNTU</p>

    <h1>Quiero ser voluntario</h1>

    <span>
      Completa el siguiente formulario y nos pondremos en contacto
      contigo para brindarte más información.
    </span>
  </div>

</section>


<section class="form-section">

  <div class="form-intro">

    <p class="section-label">
      REGISTRO DE VOLUNTARIADO
    </p>

    <h2>
      Únete a Ubuntu
    </h2>

    <p>
      Queremos conocerte. Completa tus datos y cuéntanos un poco
      sobre cómo te gustaría participar.
    </p>

  </div>


  <form class="volunteer-form">

    <div class="form-row">

      <div class="form-group">

        <label for="nombres">
          Nombres *
        </label>

        <input
          id="nombres"
          type="text"
          placeholder="Ingresa tus nombres"
          required
        >

      </div>


      <div class="form-group">

        <label for="apellidos">
          Apellidos *
        </label>

        <input
          id="apellidos"
          type="text"
          placeholder="Ingresa tus apellidos"
          required
        >

      </div>

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="email">
          Correo electrónico *
        </label>

        <input
          id="email"
          type="email"
          placeholder="ejemplo@correo.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="telefono">
          Teléfono *
        </label>

        <input
          id="telefono"
          type="tel"
          placeholder="Ingresa tu teléfono"
          required
        >

      </div>

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="edad">
          Edad
        </label>

        <input
          id="edad"
          type="number"
          placeholder="Ej. 21"
          min="18"
        >

      </div>


      <div class="form-group">

        <label for="ciudad">
          Ciudad
        </label>

        <input
          id="ciudad"
          type="text"
          placeholder="Ingresa tu ciudad"
        >

      </div>

    </div>


    <div class="form-group">

      <label for="tipo-voluntariado">
        Tipo de voluntariado *
      </label>

      <select
        id="tipo-voluntariado"
        required
      >

        <option value="">
          Selecciona una opción
        </option>

        <option value="general">
          Voluntariado general
        </option>

        <option value="profesional">
          Voluntariado profesional
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="area">
        Área de interés
      </label>

      <select id="area">

        <option value="">
          Selecciona un área
        </option>

        <option value="tecnologia">
          Tecnología
        </option>

        <option value="comunicacion">
          Comunicación
        </option>

        <option value="gestion">
          Gestión
        </option>

        <option value="educacion">
          Educación
        </option>

        <option value="otra">
          Otra
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="experiencia">
        Cuéntanos sobre ti
      </label>

      <textarea
        id="experiencia"
        rows="5"
        placeholder="Cuéntanos brevemente sobre tus conocimientos, experiencia o intereses..."
      ></textarea>

    </div>


    <div class="form-group">

      <label for="disponibilidad">
        Disponibilidad
      </label>

      <textarea
        id="disponibilidad"
        rows="3"
        placeholder="Indica tus horarios o días disponibles..."
      ></textarea>

    </div>


    <div class="privacy">

      <input
        id="consentimiento"
        type="checkbox"
        required
      >

      <label for="consentimiento">
        Autorizo el uso de los datos proporcionados en este formulario
        para que Ubuntu pueda comunicarse conmigo respecto a
        oportunidades de voluntariado. *
      </label>

    </div>


    <button
      type="submit"
      class="btn-submit"
    >
      Enviar registro
    </button>

  </form>

</section>
